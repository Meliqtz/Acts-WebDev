<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferrari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: "Inter", system-ui, sans-serif;
    }

        /* Base card */
    .tile {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 24px;
      height: 100%;
      min-height: 200px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

        /* Two cards stacked inside one column */
    .stack .tile { height: auto; }

    /* Image cards */
    .tile-img {
      background-size: cover;
      background-position: center;
      transition: transform 0.4s ease;
    }
    .tile-img::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0) 60%);
    }
    .tile-img > * { position: relative; }
    .tile-img:hover { transform: scale(1.02); }

    .hero { background-image: url("images/ferrari.jpg"); min-height: 420px; }

    /* Stat cards */
    .stat {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .stat-label {
      font-size: 0.95rem;
      color: #999;
      margin-bottom: 8px;
    }
    .tile p { color: #aaa; margin: 0; }

    .accent { background: #DC0000; border-color: #DC0000; }
    .accent .stat-label, .accent p { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

  <div class="container-fluid p-3 p-md-4">
    <div class="row g-3">
      <!-- Row 1: hero + two stacked cards -->
      <div class="col-12 col-md-8">
        <div class="tile tile-img hero">
          <h1 class="m-0">Ferrari</h1>
          <p class="m-0" style="color:#ddd;">Italian performance since 1947</p>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="d-flex flex-column gap-3 h-100 stack">
          <div class="tile accent flex-fill">
            <div class="stat-label">First Ferrari car</div>
            <div class="stat">1947</div>
          </div>
          <div class="tile flex-fill">
            <div class="stat-label">Headquarters</div>
            <div class="stat">Maranello</div>
            <p class="mt-2">Italy</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
